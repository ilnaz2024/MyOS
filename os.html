<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MyOS 1.0</title>
<style>
  body {
    margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; user-select: none;
  }
  .desktop { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .icon { width: 80px; text-align: center; cursor: pointer; padding: 8px; border-radius: 8px; }
  .icon:hover { background: rgba(255, 255, 255, 0.15); }
  .icon span { font-size: 32px; display: block; }
  .window {
    position: absolute; top: 100px; left: 200px; width: 420px; background: #1e1e1e;
    border: 1px solid #444; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: none;
  }
  .title-bar {
    background: #2d2d2d; padding: 10px 15px; border-radius: 10px 10px 0 0;
    display: flex; justify-content: space-between; cursor: move;
  }
  .close-btn { background: #e81123; border: none; color: white; border-radius: 4px; cursor: pointer; padding: 2px 8px; }
  .content { padding: 15px; }
  textarea { width: 100%; height: 180px; background: #121212; color: #0f0; border: none; outline: none; resize: none; }
  .taskbar {
    position: fixed; bottom: 0; width: 100%; height: 42px; background: rgba(15, 15, 15, 0.85);
    backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box;
  }
  .start-btn { background: #0078d4; border: none; color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="desktop">
  <div class="icon" ondblclick="openWin('notepad')"><span>📝</span>Блокнот</div>
  <div class="icon" ondblclick="openWin('about')"><span>💻</span>О системе</div>
</div>

<div class="window" id="notepad">
  <div class="title-bar" onmousedown="dragStart(event, 'notepad')">
    <span>📝 Блокнот — MyOS</span>
    <button class="close-btn" onclick="closeWin('notepad')">✕</button>
  </div>
  <div class="content"><textarea placeholder="Напишите здесь что-нибудь..."></textarea></div>
</div>

<div class="window" id="about">
  <div class="title-bar" onmousedown="dragStart(event, 'about')">
    <span>💻 О системе</span>
    <button class="close-btn" onclick="closeWin('about')">✕</button>
  </div>
  <div class="content">
    <h3>MyOS v1.0</h3>
    <p>Ваша собственная операционная система успешно запущена!</p>
  </div>
</div>

<div class="taskbar">
  <button class="start-btn" onclick="openWin('about')">⊞ Пуск</button>
  <div id="clock">12:00</div>
</div>

<script>
  function openWin(id) { document.getElementById(id).style.display = 'block'; }
  function closeWin(id) { document.getElementById(id).style.display = 'none'; }
  setInterval(() => {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }, 1000);
  let activeWin = null, offsetX = 0, offsetY = 0;
  function dragStart(e, id) {
    activeWin = document.getElementById(id);
    offsetX = e.clientX - activeWin.offsetLeft;
    offsetY = e.clientY - activeWin.offsetTop;
  }
  document.onmousemove = (e) => {
    if (activeWin) { activeWin.style.left = (e.clientX - offsetX) + 'px'; activeWin.style.top = (e.clientY - offsetY) + 'px'; }
  };
  document.onmouseup = () => { activeWin = null; };
</script>

</body>
</html>
